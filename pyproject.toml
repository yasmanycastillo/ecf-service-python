[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecfservice"
version = "0.2.0"
description = "SDK Python oficial para ECF Service — Facturación Electrónica República Dominicana (DGII)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{ name = "ECF Service SRL" }]
keywords = ["ecf", "dgii", "facturacion-electronica", "dominican-republic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-stdnum>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["ecfservice"]
